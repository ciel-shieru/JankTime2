name: Watchface CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchface-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Enforce repository and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Node.js for policy checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          check-latest: false

      - name: Enforce dependency and Android source policies
        run: node scripts/check-repo-policy.mjs

  watchface:
    needs: policy
    name: Lint, test, build, and screenshot (emery)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          check-latest: false
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.15"
          check-latest: false

      - name: Install SHA-256-verified emulator runtime from pinned Ubuntu snapshot
        run: python3 scripts/install-emulator-deps.py

      - name: Install SHA-256-pinned Pebble tool
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          python -m pip install --user --no-warn-script-location --require-hashes \
            -r requirements/pebble-tool.lock
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pebble" --version

      - name: Install and verify SHA-256-pinned Pebble SDK
        run: |
          set -euo pipefail
          "$HOME/.local/bin/pebble" sdk install 4.33.1
          "$HOME/.local/bin/pebble" sdk activate 4.33.1
          sdk_root="$(find "$HOME" -type d -name '4.33.1' -print -quit)"
          if [ -z "$sdk_root" ]; then
            echo "Could not locate installed Pebble SDK 4.33.1" >&2
            find "$HOME" -maxdepth 7 -type d -iname '*pebble*' -print >&2 || true
            exit 1
          fi
          python scripts/pebble-sdk-manifest.py --root "$sdk_root" \
            --verify tooling/pebble-sdk-4.33.1.json

      - name: Install exact npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Compile Alloy TypeScript
        run: npm run build:watch

      - name: Build production Pebble package (no preview fixtures)
        run: pebble build

      - name: Stage production watchface for sideloading
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          pbw_files=(build/*.pbw)
          if [ "${#pbw_files[@]}" -ne 1 ]; then
            printf 'Expected exactly one .pbw package under build/, found %s\n' "${#pbw_files[@]}" >&2
            printf '%s\n' "${pbw_files[@]}" >&2
            exit 1
          fi
          install -m 0644 "${pbw_files[0]}" release/janktime2-emery-production.pbw
          sha256sum release/janktime2-emery-production.pbw | awk '{print $1 "  janktime2-emery-production.pbw"}' > release/janktime2-emery-production.pbw.sha256

      - name: Upload production Pebble watchface (.pbw)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: janktime2-emery-production.pbw
          path: release/janktime2-emery-production.pbw
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload production watchface SHA-256 checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: janktime2-emery-production.pbw.sha256
          path: release/janktime2-emery-production.pbw.sha256
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Enable preview fixtures for screenshot only
        run: |
          npm run enable-preview
          pebble build

      - name: Install and capture emery screenshot with startup logs
        run: |
          mkdir -p artifacts
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            sh -eu -c '
              pebble kill || true
              pebble wipe
              PYTHONUNBUFFERED=1 pebble logs --emulator emery > artifacts/pebble-logs.txt 2>&1 &
              log_pid=$!
              trap "kill $log_pid 2>/dev/null || true; wait $log_pid 2>/dev/null || true" EXIT
              # The log command may boot the emulator itself; do not race its startup.
              sleep 20
              pebble install --emulator emery
              sleep 3
              pebble screenshot --no-open --emulator emery artifacts/screenshot_emery.png
            '
          python scripts/check_screenshot.py artifacts/screenshot_emery.png

      - name: Capture emulator diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          pebble sdk list > artifacts/pebble-sdk-list.txt 2>&1 || true
          pebble --version > artifacts/pebble-tool-version.txt 2>&1 || true

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshot_emery.png
          path: artifacts/screenshot_emery.png
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Upload emulator startup log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pebble-logs.txt
          path: artifacts/pebble-logs.txt
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pebble SDK diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pebble-sdk-list.txt
          path: artifacts/pebble-sdk-list.txt
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pebble tool version
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pebble-tool-version.txt
          path: artifacts/pebble-tool-version.txt
          archive: false
          if-no-files-found: warn
          retention-days: 14

  companion:
    needs: policy
    name: Android companion tests, lint, and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4.7.1
        with:
          distribution: temurin
          java-version: "17.0.21+9"
          cache: gradle
          cache-dependency-path: |
            companion/android/**/*.gradle*
            companion/android/gradle/libs.versions.toml
            companion/android/**/gradle.lockfile
            companion/android/gradle/verification-metadata.xml

      - name: Install and verify SHA-256-pinned Android SDK inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          python scripts/pebble-sdk-manifest.py \
            --root "$ANDROID_HOME/platforms/android-36" \
            --verify tooling/android-platform-36.json
          python scripts/pebble-sdk-manifest.py \
            --root "$ANDROID_HOME/build-tools/36.0.0" \
            --verify tooling/android-build-tools-36.0.0.json

      - name: Configure private CI debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_STORE_PASSWORD }}
          ANDROID_DEBUG_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_KEY_PASSWORD }}
          ANDROID_DEBUG_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" && -z "${ANDROID_DEBUG_KEYSTORE_STORE_PASSWORD:-}" && -z "${ANDROID_DEBUG_KEYSTORE_KEY_PASSWORD:-}" && -z "${ANDROID_DEBUG_KEYSTORE_KEY_ALIAS:-}" ]]; then
            echo "JANKTIME2_PRIVATE_DEBUG_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Debug signing secrets are not configured. Tests and lint will run, but APK assembly and artifact upload are skipped until all four Actions secrets are configured."
            exit 0
          fi
          if [[ -z "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" || -z "${ANDROID_DEBUG_KEYSTORE_STORE_PASSWORD:-}" || -z "${ANDROID_DEBUG_KEYSTORE_KEY_PASSWORD:-}" || -z "${ANDROID_DEBUG_KEYSTORE_KEY_ALIAS:-}" ]]; then
            echo "Only some CI debug-keystore secrets are configured; provide all four or none." >&2
            exit 1
          fi
          umask 077
          install -d -m 0700 "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode 2>/dev/null > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          chmod 0600 "$HOME/.android/debug.keystore"
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "JANKTIME2_PRIVATE_DEBUG_SIGNING=true" >> "$GITHUB_ENV"

      - name: Verify Android dependency pins and enforce Gradle checksums
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_STORE_PASSWORD }}
          ANDROID_DEBUG_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_KEY_PASSWORD }}
          ANDROID_DEBUG_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          chmod +x companion/android/gradlew
          # Check the wrapper JAR before executing it.
          (cd companion/android/gradle/wrapper && sha256sum --check gradle-wrapper.jar.sha256)
          # The first invocation creates candidate metadata only. Its full-file
          # SHA-256 pins are committed in tooling/gradle-dependency-pins.sha256.
          # Fail before the separate strict build if dependency metadata or lock
          # content diverges from the reviewed pins.
          if [[ "${JANKTIME2_PRIVATE_DEBUG_SIGNING:-false}" == "true" ]]; then
            android_tasks=(:app:testDebugUnitTest :app:lintDebug :app:assembleDebug)
          else
            # Validate Kotlin compilation, tests and lint without creating an APK
            # signed by an unconfigured runner-default debug key.
            android_tasks=(:app:testDebugUnitTest :app:lintDebug)
          fi
          if [[ "${JANKTIME2_PRIVATE_DEBUG_SIGNING:-false}" == "true" ]]; then
            # Refresh candidate metadata/locks only when the complete APK task graph
            # is selected, so the committed pin covers every packaged dependency.
            ./companion/android/gradlew -p companion/android --no-daemon \
              --write-verification-metadata sha256 --write-locks "${android_tasks[@]}"
          else
            # Validate Kotlin compilation, tests and lint against the committed full pin;
            # do not rewrite repository verification metadata without a reviewed change.
            ./companion/android/gradlew -p companion/android --no-daemon "${android_tasks[@]}"
          fi
          sha256sum --check tooling/gradle-dependency-pins.sha256
          # This invocation uses Gradle's existing strict artifact and metadata verification.
          ./companion/android/gradlew -p companion/android --no-daemon "${android_tasks[@]}"

      - name: Report debug APK assembly skipped
        if: success() && env.JANKTIME2_PRIVATE_DEBUG_SIGNING == 'false'
        run: echo "::warning::No APK was assembled or uploaded because the private CI debug keystore secrets are not configured."

      - name: Upload debug APK for integration testing
        if: success() && env.JANKTIME2_PRIVATE_DEBUG_SIGNING == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-debug.apk
          path: companion/android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14


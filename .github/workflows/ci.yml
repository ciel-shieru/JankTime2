name: Watchface CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchface-ci-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchface:
    name: Lint, test, build, and screenshot (emery)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          check-latest: false
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install emulator runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g libsndio7.0 xvfb

      - name: Install pinned Pebble tool and SDK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          python -m pip install --user --no-warn-script-location pebble-tool==5.0.40
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pebble" sdk install 4.33.1
          "$HOME/.local/bin/pebble" sdk activate 4.33.1

      - name: Install exact npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Compile Alloy TypeScript
        run: npm run build:watch

      - name: Build Pebble package
        run: pebble build

      - name: Install and capture emery screenshot
        run: |
          mkdir -p artifacts
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            sh -eu -c '
              pebble kill || true
              pebble wipe
              pebble install --emulator emery
              sleep 3
              pebble screenshot --no-open --emulator emery artifacts/screenshot_emery.png
            '

      - name: Capture emulator diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          timeout 8s pebble logs --emulator emery > artifacts/pebble-logs.txt 2>&1 || true
          pebble sdk list > artifacts/pebble-sdk-list.txt 2>&1 || true
          pebble --version > artifacts/pebble-tool-version.txt 2>&1 || true

      - name: Upload screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: janktime2-emery-screenshot-and-logs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

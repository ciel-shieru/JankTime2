name: Watchface CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchface-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchface:
    name: Lint, test, build, and screenshot (emery)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          check-latest: false
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.15"
          check-latest: false

      - name: Install emulator runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g libsndio7.0 xvfb

      - name: Bootstrap SHA-256 pins for Pebble tool (temporary lock generation)
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts/dependency-bootstrap
          python -m pip install --dry-run --ignore-installed \
            --report artifacts/dependency-bootstrap/pebble-tool-report.json \
            pebble-tool==5.0.40
          python scripts/pip-report-to-lock.py \
            artifacts/dependency-bootstrap/pebble-tool-report.json \
            artifacts/dependency-bootstrap/pebble-tool.lock
          python -m pip install --user --no-warn-script-location --require-hashes \
            -r artifacts/dependency-bootstrap/pebble-tool.lock
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pebble" --version

      - name: Install and digest-pin Pebble SDK
        run: |
          set -euo pipefail
          "$HOME/.local/bin/pebble" sdk install 4.33.1
          "$HOME/.local/bin/pebble" sdk activate 4.33.1
          sdk_root="$(find "$HOME/.pebble-sdk" -type d -name '4.33.1' -print -quit)"
          if [ -z "$sdk_root" ]; then
            echo "Could not locate installed Pebble SDK 4.33.1" >&2
            find "$HOME/.pebble-sdk" -maxdepth 5 -type d -print >&2 || true
            exit 1
          fi
          python scripts/pebble-sdk-manifest.py --root "$sdk_root" \
            --write artifacts/dependency-bootstrap/pebble-sdk-4.33.1.json

      - name: Install exact npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Compile Alloy TypeScript
        run: npm run build:watch

      - name: Build production Pebble package (no preview fixtures)
        run: pebble build

      - name: Stage production watchface for sideloading
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          pbw_files=(build/*.pbw)
          if [ "${#pbw_files[@]}" -ne 1 ]; then
            printf 'Expected exactly one .pbw package under build/, found %s\n' "${#pbw_files[@]}" >&2
            printf '%s\n' "${pbw_files[@]}" >&2
            exit 1
          fi
          install -m 0644 "${pbw_files[0]}" release/janktime2-emery-production.pbw
          sha256sum release/janktime2-emery-production.pbw | tee release/janktime2-emery-production.pbw.sha256

      - name: Upload production Pebble watchface (.pbw)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: janktime2-emery-pbw
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Enable preview fixtures for screenshot only
        run: |
          npm run enable-preview
          pebble build

      - name: Install and capture emery screenshot with startup logs
        run: |
          mkdir -p artifacts
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            sh -eu -c '
              pebble kill || true
              pebble wipe
              PYTHONUNBUFFERED=1 pebble logs --emulator emery > artifacts/pebble-logs.txt 2>&1 &
              log_pid=$!
              trap "kill $log_pid 2>/dev/null || true; wait $log_pid 2>/dev/null || true" EXIT
              # The log command may boot the emulator itself; do not race its startup.
              sleep 20
              pebble install --emulator emery
              sleep 3
              pebble screenshot --no-open --emulator emery artifacts/screenshot_emery.png
            '
          python scripts/check_screenshot.py artifacts/screenshot_emery.png

      - name: Capture emulator diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          pebble sdk list > artifacts/pebble-sdk-list.txt 2>&1 || true
          pebble --version > artifacts/pebble-tool-version.txt 2>&1 || true

      - name: Upload screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: janktime2-emery-screenshot-and-logs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dependency lock bootstrap outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: janktime2-toolchain-dependency-bootstrap
          path: artifacts/dependency-bootstrap/
          if-no-files-found: error
          retention-days: 14

  companion:
    name: Android companion tests, lint, and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.6.2

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: "17.0.21+9"
          cache: gradle
          cache-dependency-path: |
            companion/android/**/*.gradle*
            companion/android/gradle/libs.versions.toml
            companion/android/**/gradle.lockfile
            companion/android/gradle/verification-metadata.xml

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-36"

      - name: Generate and verify Android dependency locks and checksums
        shell: bash
        run: |
          set -euo pipefail
          chmod +x companion/android/gradlew
          ./companion/android/gradlew -p companion/android --no-daemon \
            --write-verification-metadata sha256 --write-locks \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          # A second non-bootstrap invocation must enforce the just-generated locks.
          ./companion/android/gradlew -p companion/android --no-daemon \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          mkdir -p artifacts/dependency-bootstrap/companion/android/gradle
          cp companion/android/gradle/verification-metadata.xml \
            artifacts/dependency-bootstrap/companion/android/gradle/verification-metadata.xml
          find companion/android -name gradle.lockfile -type f -print0 |
            while IFS= read -r -d '' lockfile; do
              mkdir -p "artifacts/dependency-bootstrap/$(dirname "$lockfile")"
              cp "$lockfile" "artifacts/dependency-bootstrap/$lockfile"
            done

      - name: Upload debug APK for integration testing
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: janktime2-android-companion-debug
          path: companion/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android dependency lock bootstrap outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: janktime2-android-dependency-bootstrap
          path: artifacts/dependency-bootstrap/
          if-no-files-found: error
          retention-days: 14
